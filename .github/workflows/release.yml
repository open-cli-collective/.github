name: Release (reusable)

# Reusable workflow: triggered by the caller on a release tag (from auto-release,
# #7). Builds with GoReleaser on macOS (CGO darwin can't cross-compile), gates the
# Keychain backend, publishes the GitHub release, then fans out to the packaging
# channels the manifest declares. Identity (tag prefix, binaries, channels, probes)
# comes from packaging/identity.yml via identity-check — a repo declares it once.
# See cli-common distribution.md / release.md.
#
# NOTE: @v1 must be cut (rollout step #8 follow-up) before any caller can use
# this workflow; until then the action refs below won't resolve.
on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: packaging/identity.yml
      working-directory:
        type: string
        default: "."
      goreleaser-runner:
        # pinned Apple-Silicon; CGO darwin needs a native macOS toolchain.
        type: string
        default: macos-15
      dry-run:
        # build + gate + render, skip every publish/push.
        type: boolean
        default: false
    secrets:
      homebrew-tap-token:
        required: false
      chocolatey-api-key:
        required: false
      winget-token:
        required: false
      linux-dispatch-token:
        required: false
      # macOS code-signing (distribution.md §2A). All optional + all-or-none: pass all
      # four to sign + enforce, or none to keep releasing unsigned during the v1 window.
      macos-cert-p12:
        required: false
      macos-cert-password:
        required: false
      macos-cert-cn:
        required: false
      macos-cert-leaf-sha:
        required: false

# Least privilege: only the goreleaser job writes (it publishes the release via
# the ambient GITHUB_TOKEN). Channels run as needs: jobs (not release:published
# triggers); they only read the release (gh release download) or use their own
# scoped tokens.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ${{ inputs.goreleaser-runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      identity-json: ${{ steps.meta.outputs.identity-json }}
      version: ${{ steps.meta.outputs.version }}
      final-tag: ${{ steps.meta.outputs.final-tag }}
      has-homebrew: ${{ steps.meta.outputs.has-homebrew }}
      has-winget: ${{ steps.meta.outputs.has-winget }}
      has-chocolatey: ${{ steps.meta.outputs.has-chocolatey }}
      has-linux: ${{ steps.meta.outputs.has-linux }}
      has-keychain: ${{ steps.meta.outputs.has-keychain }}
      binaries: ${{ steps.meta.outputs.binaries }}
      homebrew-matrix: ${{ steps.meta.outputs.homebrew-matrix }}
      chocolatey-matrix: ${{ steps.assets.outputs.chocolatey-matrix }}
      winget-matrix: ${{ steps.assets.outputs.winget-matrix }}
      linux-matrix: ${{ steps.meta.outputs.linux-matrix }}
      keychain-matrix: ${{ steps.meta.outputs.keychain-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # validate identity AND export the normalized manifest in one call.
      - id: identity
        uses: open-cli-collective/.github/actions/identity-check@v1
        with:
          manifest-path: ${{ inputs.manifest-path }}
          working-directory: ${{ inputs.working-directory }}
          mode: validate-and-export

      - id: meta
        shell: bash
        env:
          IDJSON: ${{ steps.identity.outputs.identity-json }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prefix="$(printf '%s' "$IDJSON" | jq -r '.tag.prefix // "v"')"
          # the tag that triggered the release (e.g. jtk-v0.1.75 or v1.0.150)
          final_tag="$REF_NAME"
          case "$final_tag" in
            "$prefix"*) version="${final_tag#"$prefix"}" ;;
            *) echo "::error::tag '$final_tag' does not start with manifest prefix '$prefix'"; exit 1 ;;
          esac
          # Monorepo prefixed tags (e.g. jtk-v…) aren't valid SemVer, so GoReleaser
          # can't parse them. Mint a temporary bare-SemVer tag and point GoReleaser
          # at it; the .goreleaser url templates pin the FINAL prefixed tag so the
          # rendered download URLs don't 404 after the post-publish rename. A bare-v
          # repo's tag is already SemVer — no temp tag, no rename.
          if [ "$prefix" != "v" ]; then
            current_tag="v${version}"; needs_rename=true
          else
            current_tag="$final_tag"; needs_rename=false
          fi
          matrix() { printf '%s' "$IDJSON" | jq -c "$1"; }
          homebrew="$(matrix '[.binaries[] | select(.packages.homebrew.canonical_cask != null) | {name, canonical_cask: .packages.homebrew.canonical_cask, alias_casks: (.packages.homebrew.alias_casks | join(" "))}]')"
          chocolatey="$(matrix '[.binaries[] | select(.packages.chocolatey.id != null) | {name, id: .packages.chocolatey.id, dir: .packages.chocolatey.dir}]')"
          winget="$(matrix '[.binaries[] | select(.packages.winget.id != null) | {name, id: .packages.winget.id, bootstrap: .packages.winget.bootstrap}]')"
          linux="$(matrix '[.binaries[] | select(.packages.linux.package_name != null) | {name, package_name: .packages.linux.package_name}]')"
          keychain="$(matrix '[.binaries[] | select(.keychain_probe != null) | {name, keychain_probe}]')"
          {
            # re-emit the normalized manifest as a single compact line for downstream jobs
            echo "identity-json=$(printf '%s' "$IDJSON" | jq -c .)"
            echo "version=$version"
            echo "final-tag=$final_tag"
            echo "goreleaser-config=$(printf '%s' "$IDJSON" | jq -r '.goreleaser_config')"
            echo "current-tag=$current_tag"
            echo "needs-rename=$needs_rename"
            echo "binaries=$(printf '%s' "$IDJSON" | jq -r '[.binaries[].name] | join(" ")')"
            echo "homebrew-matrix=$homebrew"
            echo "chocolatey-base-matrix=$chocolatey"
            echo "winget-base-matrix=$winget"
            echo "linux-matrix=$linux"
            echo "keychain-matrix=$keychain"
            echo "has-homebrew=$(jq -nr --argjson m "$homebrew" '$m | length > 0')"
            echo "has-winget=$(jq -nr --argjson m "$winget" '$m | length > 0')"
            echo "has-chocolatey=$(jq -nr --argjson m "$chocolatey" '$m | length > 0')"
            echo "has-linux=$(jq -nr --argjson m "$linux" '$m | length > 0')"
            echo "has-keychain=$(jq -nr --argjson m "$keychain" '$m | length > 0')"
          } >> "$GITHUB_OUTPUT"
          echo "release $final_tag (version $version, prefix '$prefix', current-tag $current_tag)"

      # goreleaser-config preflight: idempotent re-runs + cask skip_upload so the
      # homebrew-alias step is the single atomic tap writer. goreleaser_config is
      # repo-root-relative (goreleaser runs from root in both repo shapes).
      - uses: open-cli-collective/.github/actions/release-preflight@v1
        with:
          goreleaser-config: ${{ fromJSON(steps.meta.outputs.identity-json).goreleaser_config }}
          homebrew: ${{ steps.meta.outputs.has-homebrew }}
          tag-prefix: ${{ fromJSON(steps.meta.outputs.identity-json).tag.prefix }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true

      - name: GoReleaser check
        run: goreleaser check -f "${{ steps.meta.outputs.goreleaser-config }}"

      - name: Temporary SemVer tag (monorepo only)
        if: steps.meta.outputs.needs-rename == 'true'
        # -f: on a rerun, fetch-tags may have pulled a leftover temp tag locally;
        # force-move it to HEAD rather than failing and blocking recovery.
        run: git tag -f "${{ steps.meta.outputs.current-tag }}"

      # macOS code-signing setup (distribution.md §2A). Unconditional; self-gates on the
      # cert secrets (all-or-none) so an opt-out caller no-ops. MUST precede the snapshot
      # build so both goreleaser runs inherit the exported SIGN_IDENTITY / CODESIGN_DARWIN_SCRIPT.
      - name: macOS code-signing setup
        uses: open-cli-collective/.github/actions/macos-codesign-setup@v1
        with:
          cert-p12: ${{ secrets.macos-cert-p12 }}
          cert-password: ${{ secrets.macos-cert-password }}
          cert-cn: ${{ secrets.macos-cert-cn }}
          cert-leaf-sha: ${{ secrets.macos-cert-leaf-sha }}

      - name: Build (snapshot, no publish)
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.meta.outputs.current-tag }}
        run: goreleaser release --snapshot --clean -f "${{ steps.meta.outputs.goreleaser-config }}"

      - id: assets
        name: Resolve per-binary Windows archives
        shell: bash
        env:
          CHOCOLATEY: ${{ steps.meta.outputs.chocolatey-base-matrix }}
          WINGET: ${{ steps.meta.outputs.winget-base-matrix }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The snapshot build names its archives with the snapshot version
          # (e.g. 1.2.1-SNAPSHOT-abc1234); the published release uses the final
          # version, so rewrite that substring before handing names to the
          # Windows channels.
          snapshot_version="$(jq -r '.version' dist/metadata.json)"
          [ -n "$snapshot_version" ] && [ "$snapshot_version" != null ] || { echo "::error::dist/metadata.json has no version; the snapshot goreleaser step above must write it (check GORELEASER_CURRENT_TAG and the goreleaser config)"; exit 1; }
          enrich() {
            printf '%s' "$1" | jq -c --slurpfile artifacts dist/artifacts.json --arg snap "$snapshot_version" --arg final "$VERSION" '
              def owns($name):
                (.extra.ID // "") == $name or
                ((.extra.Binaries // []) | index($name) != null);
              def finalize: split($snap) | join($final);
              def asset($name; $arch):
                [$artifacts[0][] | select(.type == "Archive" and .goos == "windows" and .goarch == $arch and owns($name)) | .name | finalize]
                | if length == 1 then .[0] else error("expected exactly one windows/" + $arch + " archive for " + $name + "; got " + (length|tostring)) end;
              map(. + {x64_asset: asset(.name; "amd64"), arm64_asset: asset(.name; "arm64")})'
          }
          {
            echo "chocolatey-matrix=$(enrich "$CHOCOLATEY")"
            echo "winget-matrix=$(enrich "$WINGET")"
          } >> "$GITHUB_OUTPUT"

      # CGO-darwin pre-publish gate — prove the Keychain backend is present on
      # the snapshot artifacts BEFORE we publish. Skipped for tools that declare
      # no keychain_probe (no credstore backend to verify).
      - name: CGO-darwin gate
        if: steps.meta.outputs.has-keychain == 'true'
        uses: open-cli-collective/.github/actions/darwin-gate@v1
        with:
          dist-path: dist
          binaries: ${{ steps.meta.outputs.keychain-matrix }}
          # self-gated inside darwin-gate: empty leaf (no cert secret) → signature check skipped
          expected-leaf: ${{ secrets.macos-cert-leaf-sha }}

      - name: Release (publish)
        if: ${{ !inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.meta.outputs.current-tag }}
        run: goreleaser release --clean -f "${{ steps.meta.outputs.goreleaser-config }}"

      # Rename the release from the temp SemVer tag to the final prefixed tag,
      # then delete the temp tag (monorepo only). Idempotent on rerun: a prior
      # successful run already produced the final release, so drop that stale
      # release (keep its tag) before moving this run's fresh temp release onto
      # the final tag — otherwise the rename collides with the existing release.
      - name: Fix release tag (monorepo only)
        if: ${{ !inputs.dry-run && steps.meta.outputs.needs-rename == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMP_TAG: ${{ steps.meta.outputs.current-tag }}
          FINAL_TAG: ${{ steps.meta.outputs.final-tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BINARIES: ${{ steps.meta.outputs.binaries }}
        run: |
          set -euo pipefail
          if gh release view "$FINAL_TAG" >/dev/null 2>&1; then
            echo "::notice::final release $FINAL_TAG already exists (rerun) — replacing it"
            # If the rename below fails after this delete, this run's artifacts
            # are still on the $TEMP_TAG release; recover by re-running this job
            # (or manually: gh release edit "$TEMP_TAG" --tag "$FINAL_TAG").
            gh release delete "$FINAL_TAG" --yes   # drop the release, keep its git tag
          fi
          title="$(printf '%s' "$BINARIES" | tr ' ' '+')"
          gh release edit "$TEMP_TAG" --tag "$FINAL_TAG" --title "$title $VERSION"
          git push origin ":refs/tags/$TEMP_TAG" || true   # temp tag may not be on the remote

      # Confirm the published cask render (real .Version) pins the final tag.
      # release-preflight intentionally lets bare-v repos omit url.template, so the
      # default cask renders the tag as Homebrew interpolation (/download/v#{version}/)
      # rather than a literal tag — and even url.template repos commit the interpolated
      # form to the tap. Both pin the final tag (Homebrew resolves #{version} at
      # install), so accept either the literal final tag or the final-tag prefix plus
      # #{version}. A prefixed repo (e.g. jtk-v) that emits a bare v#{version} still
      # fails, preserving the wrong-prefix guard.
      - name: Confirm published cask URL pins the final tag
        if: ${{ !inputs.dry-run && steps.meta.outputs.has-homebrew == 'true' }}
        env:
          HOMEBREW: ${{ steps.meta.outputs.homebrew-matrix }}
          FINAL_TAG: ${{ steps.meta.outputs.final-tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The final tag ends with the version; the prefix is everything before it
          # ("v" for bare repos, "jtk-v" for prefixed ones).
          prefix="${FINAL_TAG%"$VERSION"}"
          interp_tag="${prefix}#{version}"
          printf '%s' "$HOMEBREW" | jq -r '.[].canonical_cask' | while IFS= read -r canonical; do
            cask="$(find dist -name "${canonical}.rb" -print -quit)"
            [ -n "$cask" ] || { echo "::error::canonical cask ${canonical}.rb not rendered in dist (skip_upload cask missing?)"; exit 1; }
            if grep -Fq "/download/${FINAL_TAG}/" "$cask" || grep -Fq "/download/${interp_tag}/" "$cask"; then
              echo "$canonical cask URL pins ${FINAL_TAG} (literal or ${interp_tag})"
            else
              echo "::error::cask $cask pins neither the literal final tag ${FINAL_TAG} nor ${interp_tag} in its download URL"
              exit 1
            fi
          done

      - name: Upload dist
        if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          # window for re-running a failed channel job after the goreleaser job
          retention-days: 5

  # The only job that holds homebrew-tap-token (kept out of the goreleaser job so
  # a skip_upload mistake can't push via GoReleaser). Writes canonical + aliases
  # atomically. Hard-fail: a broken tap publish must fail the release loudly.
  homebrew:
    needs: goreleaser
    if: ${{ !inputs.dry-run && needs.goreleaser.outputs.has-homebrew == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.goreleaser.outputs.homebrew-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - id: locate
        shell: bash
        env:
          CANONICAL: ${{ matrix.canonical_cask }}
        run: |
          set -euo pipefail
          cask="$(find dist -name "${CANONICAL}.rb" -print -quit)"
          [ -n "$cask" ] || { echo "::error::canonical cask ${CANONICAL}.rb not found in dist artifact"; exit 1; }
          echo "cask=$cask" >> "$GITHUB_OUTPUT"
      - uses: open-cli-collective/.github/actions/homebrew-alias@v1
        with:
          canonical-cask-file: ${{ steps.locate.outputs.cask }}
          canonical-token: ${{ matrix.canonical_cask }}
          alias-tokens: ${{ matrix.alias_casks }}
          tap-repo: open-cli-collective/homebrew-tap
          tap-token: ${{ secrets.homebrew-tap-token }}

  chocolatey:
    needs: goreleaser
    if: ${{ !inputs.dry-run && needs.goreleaser.outputs.has-chocolatey == 'true' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.goreleaser.outputs.chocolatey-matrix) }}
    env:
      VERSION: ${{ needs.goreleaser.outputs.version }}
      FINAL_TAG: ${{ needs.goreleaser.outputs.final-tag }}
      CHOCO_ID: ${{ matrix.id }}
      X64_ASSET: ${{ matrix.x64_asset }}
      ARM64_ASSET: ${{ matrix.arm64_asset }}
      CHOCO_DIR: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - name: Get checksums from release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:FINAL_TAG" --pattern "checksums.txt" --dir .
          $checksums = Get-Content checksums.txt
          $x64Hash = ($checksums | Select-String -SimpleMatch $env:X64_ASSET).Line.Split()[0]
          $arm64Hash = ($checksums | Select-String -SimpleMatch $env:ARM64_ASSET).Line.Split()[0]
          if (-not $x64Hash) { Write-Error "no checksum for $env:X64_ASSET in checksums.txt"; exit 1 }
          if (-not $arm64Hash) { Write-Error "no checksum for $env:ARM64_ASSET in checksums.txt"; exit 1 }
          echo "X64_HASH=$x64Hash" >> $env:GITHUB_ENV
          echo "ARM64_HASH=$arm64Hash" >> $env:GITHUB_ENV
      - name: Update version and checksums
        shell: pwsh
        # paths are tool-local: working-directory-relative so a monorepo's
        # tools/<tool>/packaging/chocolatey resolves (flat repos pass ".").
        working-directory: ${{ inputs.working-directory }}
        run: |
          $nuspec = "$env:CHOCO_DIR/$env:CHOCO_ID.nuspec"
          $content = Get-Content $nuspec -Raw
          # fail loud if the placeholder isn't present — a silent no-op would pack the wrong version
          if ($content -notmatch '<version>0\.0\.0</version>') { Write-Error "nuspec $nuspec has no <version>0.0.0</version> placeholder"; exit 1 }
          $content -replace '<version>0.0.0</version>', "<version>$env:VERSION</version>" | Set-Content $nuspec
          $script = "$env:CHOCO_DIR/tools/chocolateyInstall.ps1"
          $content = Get-Content $script -Raw
          # fail loud if a placeholder is absent — a silent no-op would push literal placeholders
          if ($content -notmatch 'CHECKSUM_AMD64_PLACEHOLDER') { Write-Error "$script has no CHECKSUM_AMD64_PLACEHOLDER"; exit 1 }
          if ($content -notmatch 'CHECKSUM_ARM64_PLACEHOLDER') { Write-Error "$script has no CHECKSUM_ARM64_PLACEHOLDER"; exit 1 }
          $content = $content -replace 'CHECKSUM_AMD64_PLACEHOLDER', $env:X64_HASH
          $content = $content -replace 'CHECKSUM_ARM64_PLACEHOLDER', $env:ARM64_HASH
          Set-Content $script $content
      - name: Pack and push
        uses: open-cli-collective/.github/actions/chocolatey-push@v1
        with:
          package-id: ${{ matrix.id }}
          working-directory: ${{ inputs.working-directory }}
          package-directory: ${{ matrix.dir }}
          api-key: ${{ secrets.chocolatey-api-key }}

  # winget/linux are best-effort: Microsoft-hosted flakiness must not gate the
  # binary/Homebrew artifacts. Failure surfaces in the step summary.
  winget:
    needs: goreleaser
    if: ${{ !inputs.dry-run && needs.goreleaser.outputs.has-winget == 'true' }}
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.goreleaser.outputs.winget-matrix) }}
    env:
      VERSION: ${{ needs.goreleaser.outputs.version }}
      FINAL_TAG: ${{ needs.goreleaser.outputs.final-tag }}
      WINGET_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: open-cli-collective/.github/actions/winget-submit@v1
        with:
          package-id: ${{ matrix.id }}
          version: ${{ needs.goreleaser.outputs.version }}
          final-tag: ${{ needs.goreleaser.outputs.final-tag }}
          repo: ${{ github.repository }}
          working-directory: ${{ inputs.working-directory }}
          bootstrap: ${{ matrix.bootstrap }}
          x64-marker: ${{ matrix.x64_asset }}
          arm64-marker: ${{ matrix.arm64_asset }}
          github-token: ${{ github.token }}
          winget-token: ${{ secrets.winget-token }}
      # Surface ANY failure (missing token, asset resolution, wingetcreate) — a
      # continue-on-error job would otherwise go green with no trace.
      - name: Note winget failure
        if: ${{ failure() }}
        shell: bash
        run: echo "⚠️ winget channel failed for ${WINGET_ID} ${VERSION} — see the winget job logs" >> "$GITHUB_STEP_SUMMARY"

  linux-packages:
    needs: goreleaser
    if: ${{ !inputs.dry-run && needs.goreleaser.outputs.has-linux == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.goreleaser.outputs.linux-matrix) }}
    steps:
      - name: Dispatch linux-packages build
        env:
          DISPATCH_TOKEN: ${{ secrets.linux-dispatch-token }}
          PACKAGE: ${{ matrix.package_name }}
          FINAL_TAG: ${{ needs.goreleaser.outputs.final-tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "$DISPATCH_TOKEN" ] || { echo "::error::linux-dispatch-token not set"; exit 1; }
          payload="$(jq -nc --arg p "$PACKAGE" --arg v "$FINAL_TAG" --arg r "$REPO" \
            '{event_type:"package-release", client_payload:{package:$p, version:$v, repo:$r}}')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/open-cli-collective/linux-packages/dispatches" \
            -d "$payload"
          echo "dispatched package-release for $PACKAGE@$FINAL_TAG"
      # Surface ANY failure (missing token, dispatch HTTP error) so a
      # continue-on-error job can't go green silently.
      - name: Note linux-packages failure
        if: ${{ failure() }}
        env:
          PACKAGE: ${{ matrix.package_name }}
          FINAL_TAG: ${{ needs.goreleaser.outputs.final-tag }}
        run: echo "⚠️ linux-packages dispatch failed for ${PACKAGE} ${FINAL_TAG} — see the linux-packages job logs" >> "$GITHUB_STEP_SUMMARY"
