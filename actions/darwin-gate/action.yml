name: CGO-darwin pre-publish gate
description: >
  Prove the darwin binaries actually carry the Keychain (CGO) backend before
  anything is published: artifact sanity, Mach-O arch + Security.framework
  linkage, and a manifest-driven functional probe. Runs on a macOS runner only
  (needs file/lipo/otool). All logic is in the unit-tested darwin-gate.sh.
inputs:
  dist-path:
    description: "goreleaser dist directory (holds artifacts.json + binaries)"
    required: false
    default: dist
  binaries:
    description: "JSON array of {name,keychain_probe} entries"
    required: true
  expected-leaf:
    description: "pinned signing-cert leaf SHA-1 (MACOS_CERT_LEAF_SHA). Empty = skip the signature check (unsigned / opt-out caller)."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        DIST: ${{ inputs.dist-path }}
        BINARIES: ${{ inputs.binaries }}
        ACTION_PATH: ${{ github.action_path }}
        EXPECTED_LEAF: ${{ inputs.expected-leaf }}
      run: |
        set -euo pipefail
        gate="$ACTION_PATH/darwin-gate.sh"
        [ -f "$gate" ] || { echo "::error::darwin-gate.sh not found at $gate"; exit 1; }
        art="$DIST/artifacts.json"
        [ -f "$art" ] || { echo "::error::artifacts.json not found at $art"; exit 1; }

        names="$(printf '%s' "$BINARIES" | jq -c '[.[].name]')"
        bash "$gate" check-artifacts "$art" "$names"

        printf '%s' "$BINARIES" | jq -c '.[]' | while IFS= read -r binary; do
          name="$(printf '%s' "$binary" | jq -r '.name')"
          probe="$(printf '%s' "$binary" | jq -c '.keychain_probe')"
          arm="$(jq -r --arg name "$name" '[.[]|select(.type=="Binary" and .name==$name and .goos=="darwin" and .goarch=="arm64")][0].path' "$art")"
          amd="$(jq -r --arg name "$name" '[.[]|select(.type=="Binary" and .name==$name and .goos=="darwin" and .goarch=="amd64")][0].path' "$art")"
          [ -n "$arm" ] && [ "$arm" != null ] && [ -f "$arm" ] || { echo "::error::$name arm64 darwin binary path not resolved"; exit 1; }
          [ -n "$amd" ] && [ "$amd" != null ] && [ -f "$amd" ] || { echo "::error::$name amd64 darwin binary path not resolved"; exit 1; }
          bash "$gate" check-macho "$arm" "$amd"
          bash "$gate" probe "$probe" "$arm"
          if [ -n "$EXPECTED_LEAF" ]; then
            bash "$gate" check-signature "$arm" "$amd" "$EXPECTED_LEAF" "org.open-cli-collective.$name"
          else
            echo "::notice::no expected-leaf — skipping $name code-signing check (unsigned release)"
          fi
        done
        echo "::notice::CGO-darwin gate passed"
